# Conda environment for LeRobot 0.5.x + CRP dual-arm (Python 3.12+).
# Create:  conda env create -f environment-crp.yml
# Update:  conda env update -f environment-crp.yml --prune
# Activate: conda activate lerobot

name: lerobot
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ffmpeg
  - compilers
  - pip:
      - pybind11>=2.12
      - -e ".[feetech]"
